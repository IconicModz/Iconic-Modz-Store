<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICONIC MODZ | Official Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0809;
            --bg-gradient: radial-gradient(circle at top, #1f080c 0%, #0a0809 70%);
            --card-bg: rgba(22, 14, 16, 0.75);
            --card-hover: rgba(35, 20, 24, 0.9);
            --accent-red: #ff2a4b;
            --accent-red-glow: rgba(255, 42, 75, 0.4);
            --accent-crimson: #d60029;
            --accent-green: #00e676;
            --accent-gold: #ffb700;
            --text-main: #ffffff;
            --text-muted: #a09095;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-red: rgba(255, 42, 75, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { 
            background: var(--bg-dark);
            background-image: var(--bg-gradient);
            color: var(--text-main); 
            min-height: 100vh; 
            padding-bottom: 50px;
            overflow-x: hidden;
        }

        nav { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 16px 24px; 
            background: rgba(10, 8, 9, 0.85); 
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-red); 
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-brand { 
            font-family: 'Orbitron', sans-serif; 
            font-size: 1.5rem; 
            font-weight: 900; 
            color: #fff; 
            cursor: pointer;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }
        .nav-brand span { 
            color: var(--accent-red); 
            text-shadow: 0 0 12px var(--accent-red-glow);
        }

        .container { max-width: 1000px; margin: 0 auto; padding: 25px 15px; }

        .breadcrumb { display: flex; align-items: center; gap: 10px; margin-bottom: 25px; font-size: 0.9rem; color: var(--text-muted); }
        .back-btn { 
            background: rgba(255, 255, 255, 0.05); 
            color: #fff; 
            border: 1px solid var(--border-color); 
            padding: 8px 16px; 
            border-radius: 8px; 
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .back-btn:hover { background: var(--accent-red); border-color: var(--accent-red); box-shadow: 0 0 12px var(--accent-red-glow); }

        .page-title { 
            font-family: 'Orbitron', sans-serif; 
            font-size: 1.8rem; 
            font-weight: 900; 
            text-transform: uppercase; 
            margin-bottom: 25px; 
            letter-spacing: 0.5px;
        }
        .page-title span { color: var(--accent-red); text-shadow: 0 0 15px var(--accent-red-glow); }

        .view-section { display: none; animation: fadeIn 0.3s ease-in-out; }
        .view-section.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Game Cards */
        .games-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .game-card { 
            background: var(--card-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 18px; 
            padding: 20px; 
            text-align: center; 
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }
        .game-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent-red), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .game-card:hover { 
            border-color: var(--accent-red); 
            background: var(--card-hover);
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(255, 42, 75, 0.25);
        }
        .game-card:hover::before { opacity: 1; }

        .game-img-wrapper { 
            width: 100%; 
            height: 180px; 
            border-radius: 12px; 
            overflow: hidden;
            margin-bottom: 15px; 
            border: 1px solid var(--border-red);
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .game-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        .game-card:hover .game-img-wrapper img {
            transform: scale(1.05);
        }

        .game-title { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight: 800; letter-spacing: 0.5px; }

        /* Category Grid */
        .category-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; }
        .category-card { 
            background: var(--card-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 14px; 
            padding: 22px 15px; 
            text-align: center; 
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .category-card:hover { 
            border-color: var(--accent-red); 
            background: var(--card-hover);
            transform: scale(1.02);
            box-shadow: 0 6px 18px var(--accent-red-glow);
        }
        .category-card.custom-mod-card { 
            border: 1px dashed var(--accent-gold); 
            background: rgba(255, 183, 0, 0.04);
        }
        .category-card.custom-mod-card:hover { 
            border-color: var(--accent-gold); 
            box-shadow: 0 6px 18px rgba(255, 183, 0, 0.25);
        }
        .category-icon { font-size: 2.2rem; margin-bottom: 12px; }
        .category-name { font-family: 'Orbitron', sans-serif; font-size: 0.9rem; font-weight: 700; }

        /* Mods Cards */
        .mods-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .mod-card { 
            background: var(--card-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 16px; 
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .mod-card:hover { border-color: var(--accent-red); box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
        .mod-banner { 
            height: 150px; 
            background: rgba(255, 255, 255, 0.02); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: var(--text-muted); 
            position: relative;
            border-bottom: 1px solid var(--border-color);
        }
        .badge { 
            position: absolute; 
            top: 12px; 
            left: 12px; 
            padding: 5px 10px; 
            border-radius: 6px; 
            font-size: 0.7rem; 
            font-weight: 800; 
            letter-spacing: 0.5px;
            font-family: 'Orbitron', sans-serif;
        }
        .badge-free { background: var(--accent-green); color: #000; box-shadow: 0 0 10px rgba(0, 230, 118, 0.4); }
        .badge-paid { background: var(--accent-red); color: #fff; box-shadow: 0 0 10px var(--accent-red-glow); }
        
        .mod-body { padding: 18px; }
        .mod-title { font-family: 'Orbitron', sans-serif; font-size: 1rem; font-weight: 800; margin-bottom: 16px; }
        .mod-actions { display: flex; gap: 10px; }

        .btn { 
            flex: 1; 
            padding: 12px; 
            border: none; 
            border-radius: 8px; 
            font-weight: 700; 
            font-size: 0.82rem; 
            cursor: pointer; 
            text-align: center; 
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-view { background: rgba(255, 255, 255, 0.08); color: #fff; }
        .btn-view:hover { background: rgba(255, 255, 255, 0.15); }
        .btn-action { 
            background: linear-gradient(135deg, var(--accent-red), var(--accent-crimson)); 
            color: #fff; 
            box-shadow: 0 4px 12px var(--accent-red-glow);
        }
        .btn-action:hover { opacity: 0.9; transform: translateY(-1px); }

        /* Custom Form */
        .custom-form-container { 
            background: var(--card-bg); 
            border: 1px solid var(--border-red); 
            border-radius: 18px; 
            padding: 25px; 
            max-width: 500px; 
            margin: 0 auto; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .form-group { margin-bottom: 18px; }
        .form-label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 8px; color: var(--text-main); }
        .form-control { 
            width: 100%; 
            padding: 12px 14px; 
            background: rgba(0, 0, 0, 0.4); 
            border: 1px solid var(--border-color); 
            border-radius: 10px; 
            color: #fff; 
            font-size: 0.9rem; 
            outline: none; 
            transition: border-color 0.2s;
        }
        .form-control:focus { border-color: var(--accent-red); box-shadow: 0 0 8px var(--accent-red-glow); }
        .btn-submit { 
            width: 100%; 
            padding: 14px; 
            background: linear-gradient(135deg, var(--accent-red), var(--accent-crimson)); 
            color: #fff; 
            border: none; 
            border-radius: 10px; 
            font-family: 'Orbitron', sans-serif; 
            font-weight: 800; 
            cursor: pointer; 
            letter-spacing: 1px;
            box-shadow: 0 5px 15px var(--accent-red-glow);
        }

        /* Modal Overlay */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.active { display: flex; animation: fadeIn 0.2s ease; }
        .modal-box { 
            background: #140d0f; 
            border: 1px solid var(--border-red); 
            border-radius: 18px; 
            max-width: 450px; 
            width: 100%; 
            padding: 25px; 
            position: relative; 
            box-shadow: 0 0 30px var(--accent-red-glow);
        }
        .modal-close { position: absolute; top: 12px; right: 18px; background: none; border: none; color: var(--text-muted); font-size: 1.6rem; cursor: pointer; }
        .modal-title { font-family: 'Orbitron', sans-serif; font-size: 1.25rem; margin-bottom: 12px; color: var(--accent-red); }
        .payment-info { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-color); padding: 14px; border-radius: 10px; margin: 12px 0; font-size: 0.88rem; line-height: 1.5; }
    </style>
</head>
<body>

    <nav>
        <div class="nav-brand" onclick="showStep(1)">ICONIC<span>MODZ</span></div>
    </nav>

    <div class="container">

        <!-- STEP 1: Select Game -->
        <div id="step-1" class="view-section active">
            <h1 class="page-title">Select <span>Game</span></h1>
            <div class="games-grid">
                
                <!-- HCTP Card -->
                <div class="game-card" onclick="openGame('hctp', 'WWE SmackDown! Here Comes The Pain')">
                    <div class="game-img-wrapper">
                        <img src="https://images.launchbox-app.com/3bd86e4d-74d1-4cb5-8d8d-2947e4eb19f9.jpg" alt="WWE HCTP Cover">
                    </div>
                    <div class="game-title">WWE SmackDown! Here Comes The Pain</div>
                </div>

                <!-- SvR Card -->
                <div class="game-card" onclick="openGame('svr', 'WWE SmackDown vs. Raw')">
                    <div class="game-img-wrapper">
                        <img src="https://images.launchbox-app.com/eebe329c-85aa-43d9-9524-81e0a2d2165d.jpg" alt="WWE SvR Cover">
                    </div>
                    <div class="game-title">WWE SmackDown vs. Raw</div>
                </div>

            </div>
        </div>

        <!-- STEP 2: Select Category -->
        <div id="step-2" class="view-section">
            <div class="breadcrumb">
                <button class="back-btn" onclick="showStep(1)">← Back</button>
                <span id="game-breadcrumb-title">Game</span>
            </div>
            <h1 class="page-title">Select <span>Category</span></h1>
            <div class="category-grid">
                <div class="category-card" onclick="openCategory('Wrestlers Models')">
                    <div class="category-icon">👤</div>
                    <div class="category-name">Wrestlers Models</div>
                </div>
                <div class="category-card" onclick="openCategory('Full Game Mods')">
                    <div class="category-icon">🎮</div>
                    <div class="category-name">Full Game Mods</div>
                </div>
                <div class="category-card" onclick="openCategory('Move Sets')">
                    <div class="category-icon">⚡</div>
                    <div class="category-name">Move Sets</div>
                </div>
                <div class="category-card" onclick="openCategory('Arenas')">
                    <div class="category-icon">🏟️</div>
                    <div class="category-name">Arenas</div>
                </div>
                <div class="category-card" onclick="openCategory('Titantrons')">
                    <div class="category-icon">🎬</div>
                    <div class="category-name">Titantrons</div>
                </div>
                <div class="category-card custom-mod-card" onclick="openCustomMods()">
                    <div class="category-icon">🛠️</div>
                    <div class="category-name" style="color: var(--accent-gold);">Create Custom Mods</div>
                </div>
            </div>
        </div>

        <!-- STEP 3: Mods List -->
        <div id="step-3" class="view-section">
            <div class="breadcrumb">
                <button class="back-btn" onclick="showStep(2)">← Back</button>
                <span id="category-breadcrumb-title">Category</span>
            </div>
            <h1 class="page-title" id="mods-page-title">Available <span>Mods</span></h1>
            <div class="mods-grid" id="mods-container"></div>
        </div>

        <!-- STEP 4: Custom Mod Order Page -->
        <div id="step-custom" class="view-section">
            <div class="breadcrumb">
                <button class="back-btn" onclick="showStep(2)">← Back</button>
                <span>Create Custom Mod</span>
            </div>
            <h1 class="page-title" style="color: var(--accent-gold);">Create <span>Custom Mod</span></h1>
            <div class="custom-form-container">
                <form onsubmit="handleCustomSubmit(event)">
                    <div class="form-group">
                        <label class="form-label">Select Wrestler Model:</label>
                        <select class="form-control" id="wrestlerSelect">
                            <option value="">-- Choose Wrestler From List --</option>
                            <option value="The Rock">The Rock</option>
                            <option value="Stone Cold">Stone Cold Steve Austin</option>
                            <option value="John Cena">John Cena</option>
                            <option value="Roman Reigns">Roman Reigns</option>
                            <option value="Undertaker">Undertaker</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Or Custom Name:</label>
                        <input type="text" class="form-control" id="customWrestlerInput" placeholder="e.g. Brock Lesnar (2003 Attire)">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Mod Type Required:</label>
                        <select class="form-control" id="modTypeSelect" required>
                            <option value="Wrestler Model">Wrestler Model</option>
                            <option value="Full Game Mod">Full Game Mod</option>
                            <option value="Move Set">Move Set</option>
                            <option value="Arena">Arena</option>
                            <option value="Titantron">Titantron</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Details:</label>
                        <textarea class="form-control" id="customNotes" rows="3" placeholder="Enter instructions..."></textarea>
                    </div>
                    <button type="submit" class="btn-submit">🚀 SUBMIT REQUEST</button>
                </form>
            </div>
        </div>

    </div>

    <!-- Details / Get Modal -->
    <div class="modal-overlay" id="mod-modal">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <h2 class="modal-title" id="modal-mod-title">Mod Title</h2>
            <div id="modal-content"></div>
        </div>
    </div>

    <script>
        var currentGame = '';
        var currentGameName = '';
        var currentCategory = '';

        function showStep(stepNum) {
            var views = document.querySelectorAll('.view-section');
            for (var i = 0; i < views.length; i++) {
                views[i].classList.remove('active');
            }
            if (typeof stepNum === 'number') {
                document.getElementById('step-' + stepNum).classList.add('active');
            } else {
                document.getElementById('step-' + stepNum).classList.add('active');
            }
        }

        function openGame(gameKey, gameName) {
            currentGame = gameKey;
            currentGameName = gameName;
            document.getElementById('game-breadcrumb-title').innerText = gameName;
            showStep(2);
        }

        function openCategory(catName) {
            currentCategory = catName;
            document.getElementById('category-breadcrumb-title').innerText = currentGameName + ' > ' + catName;
            document.getElementById('mods-page-title').innerHTML = catName + ' <span>Mods</span>';
            renderMods();
            showStep(3);
        }

        function openCustomMods() {
            showStep('custom');
        }

            var container = document.getElementById('mods-container');
            container.innerHTML = '';

            if (currentGame === 'hctp' && currentCategory === 'Full Game Mods') {

                        <div class="mod-body">
                            <div class="mod-title">Free Iconic Edition Modz</div>
                            <div class="mod-actions">
