   <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICONIC MODZ | Official Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050508;
            --card-bg: rgba(18, 18, 28, 0.75);
            --neon-red: #ff0055;
            --neon-orange: #ff5500;
            --neon-purple: #8a2be2;
            --text-main: #ffffff;
            --text-muted: #9a9ab0;
            --border-glow: rgba(255, 0, 85, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Ambient Background Glows */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(140px);
            z-index: -1;
            opacity: 0.5;
            animation: pulseGlow 8s infinite alternate ease-in-out;
        }

        body::before {
            top: -50px;
            left: 10%;
            background: var(--neon-red);
        }

        body::after {
            bottom: 50px;
            right: 10%;
            background: var(--neon-purple);
            animation-delay: 4s;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1) translate(0, 0); opacity: 0.4; }
            100% { transform: scale(1.2) translate(30px, 30px); opacity: 0.7; }
        }

        /* Subtle Grid Pattern Overlay */
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
            pointer-events: none;
        }

        /* Header Section */
        header {
            width: 100%;
            max-width: 1100px;
            text-align: center;
            padding: 60px 20px 40px;
        }

        .brand-logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.8rem;
            font-weight: 900;
            letter-spacing: 6px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff 0%, var(--neon-red) 50%, var(--neon-orange) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 35px rgba(255, 0, 85, 0.4);
            margin-bottom: 12px;
        }

        .brand-subtitle {
            font-size: 1.2rem;
            color: var(--text-muted);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 700;
        }

        /* Main Container */
        main {
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            flex: 1;
        }

        .mods-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            margin-top: 20px;
        }

        /* Premium Mod Cards */
        .mod-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 35px 25px;
            text-align: center;
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .mod-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--neon-red), var(--neon-orange));
            opacity: 0.8;
            transition: all 0.4s ease;
        }

        .mod-card:hover {
            transform: translateY(-10px);
            border-color: var(--neon-red);
            box-shadow: 0 15px 35px rgba(255, 0, 85, 0.25);
        }

        .mod-card:hover::before {
            height: 6px;
            box-shadow: 0 0 15px var(--neon-red);
        }

        .mod-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 15px;
            letter-spacing: 1.5px;
            line-height: 1.3;
            text-transform: uppercase;
        }

        .mod-badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(255, 0, 85, 0.15);
            border: 1px solid var(--neon-red);
            color: var(--neon-red);
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        .btn-action {
            display: block;
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(45deg, var(--neon-red), var(--neon-orange));
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            text-decoration: none;
            border-radius: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 0, 85, 0.3);
        }

        .btn-action:hover {
            opacity: 0.95;
            box-shadow: 0 8px 25px rgba(255, 0, 85, 0.5);
            transform: scale(1.02);
        }

        /* Footer */
        footer {
            margin-top: 80px;
            padding: 25px 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            letter-spacing: 1px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            width: 100%;
        }

        @media (max-width: 600px) {
            .brand-logo { font-size: 2.5rem; }
            .brand-subtitle { font-size: 0.95rem; }
            .mod-title { font-size: 1.25rem; }
        }
    </style>
</head>
<body>

    <div class="bg-grid"></div>

    <!-- Header -->
    <header>
        <div class="brand-logo">ICONIC MODZ</div>
        <div class="brand-subtitle">Official Edition Store</div>
    </header>

    <!-- Main Section -->
    <main>
        <div class="mods-container">
            
            <!-- V1 Mods Card -->
            <div class="mod-card">
                <div class="mod-title">WWE HCTP Iconic Edition V1 Mods</div>
                <div class="mod-badge">Version 1.0</div>
                <a href="#" class="btn-action">Explore / Download</a>
            </div>

            <!-- V2 Mods Card -->
            <div class="mod-card">
                <div class="mod-title">WWE HCTP Iconic Edition V2 Mods</div>
                <div class="mod-badge">Version 2.0</div>
                <a href="#" class="btn-action">Explore / Download</a>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer>
        &copy; 2026 ICONIC MODZ. All rights reserved.
    </footer>

</body>
</html>
